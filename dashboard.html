<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试工作台</title>
<style>
  :root {
    /* ── 黑白蓝三色体系（参考 Apple 官网）── */
    --bg: #f5f5f7;              /* 页面背景：苹果浅灰 */
    --card-bg: #ffffff;         /* 卡片背景 */
    --border: #d2d2d7;          /* 分隔线：苹果分隔灰 */
    --text: #1d1d1f;            /* 主文字：苹果近黑 */
    --text-secondary: #6e6e73;  /* 次级文字 */
    --text-tertiary: #86868b;   /* 弱化文字 */
    --blue: #0071e3;            /* 主强调：苹果蓝 */
    --blue-strong: #0060bf;     /* 悬停加深 */
    --blue-soft: #e8f1fb;       /* 蓝色浅底 */
    --neutral-soft: #f0f0f2;    /* 中性浅灰底 */

    /* 语义别名：原绿/黄/红统一收敛进黑白蓝体系（green→蓝、yellow→灰、red→近黑） */
    --green: #0071e3;
    --yellow: #86868b;
    --red: #1d1d1f;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "PingFang SC", "Hiragino Sans GB", "Helvetica Neue",
            "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #b0b0b5; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ═══ 左侧导航树 ═══ */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: #fbfbfd;
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }

  .sidebar-header {
    padding: 24px 24px 20px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sidebar-header .logo { font-size: 22px; }

  /* 知识库入口 */
  .kb-entry {
    padding: 12px 24px;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background .15s;
  }
  .kb-entry:hover { background: rgba(0,0,0,.04); }
  .kb-entry .badge {
    background: var(--blue);
    color: #fff;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 999px;
    font-weight: 600;
  }

  .kb-children { display: none; }
  .kb-children.open { display: block; }
  .kb-child {
    padding: 8px 24px 8px 40px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background .15s, color .15s;
  }
  .kb-child:hover { color: var(--text); background: rgba(0,0,0,.04); }
  .kb-child.active { color: var(--blue); background: var(--blue-soft); font-weight: 500; }

  /* 岗位列表 */
  .positions-section {
    padding: 20px 24px 8px;
    font-size: 12px;
    color: var(--text-tertiary);
    letter-spacing: .04em;
    font-weight: 600;
  }

  .pos-item { padding: 10px 24px; cursor: pointer; font-size: 13px; transition: background .15s; }
  .pos-item:hover { background: rgba(0,0,0,.04); }
  .pos-item.active { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
  .pos-item .pos-name { font-weight: 500; }
  .pos-item.active .pos-name { color: var(--blue); }
  .pos-item .pos-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

  .pos-children { display: none; }
  .pos-children.open { display: block; padding-left: 8px; }
  .pos-child {
    padding: 7px 24px 7px 40px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-secondary);
    transition: color .15s;
  }
  .pos-child:hover { color: var(--text); }
  .pos-child.active { color: var(--blue); font-weight: 500; }

  /* 底部按钮 */
  .sidebar-footer { padding: 20px 24px; margin-top: auto; border-top: 1px solid var(--border); }
  .btn-new {
    width: 100%;
    padding: 11px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-new:hover { background: var(--blue-strong); }

  /* ═══ 右侧内容区 ═══ */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶栏 */
  .topbar {
    height: 60px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    flex-shrink: 0;
  }
  .topbar .page-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar .bell {
    position: relative;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-secondary);
  }
  .topbar .bell .dot {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 16px;
    height: 16px;
    background: var(--blue);
    border-radius: 50%;
    font-size: 10px;
    color: #fff;
    align-items: center;
    justify-content: center;
    display: none;
  }
  .topbar .bell .dot.show { display: flex; }

  /* 内容面板 */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 32px 32px 40px;
  }

  /* ═══ 卡片 ═══ */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h3 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  /* 统计行 */
  .stats-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    min-width: 150px;
    flex: 1;
  }
  .stat-card .num { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .stat-card.green .num { color: var(--green); }
  .stat-card.yellow .num { color: var(--yellow); }
  .stat-card.red .num { color: var(--red); }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: .02em;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.6; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  /* 可点击行 */
  .clickable-row { cursor: pointer; transition: background .15s; }
  .clickable-row:hover td { background: var(--blue-soft) !important; }

  /* 返回按钮 */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--blue);
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 20px;
    transition: color .15s;
  }
  .back-btn:hover { color: var(--blue-strong); }

  /* 经历详情 */
  .exp-detail-section { margin-bottom: 20px; }
  .exp-detail-section .label {
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: .02em;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .exp-detail-section .value {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }

  /* 面试复盘 */
  .review-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: box-shadow .15s, border-color .15s;
  }
  .review-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.06); border-color: var(--blue); }
  .review-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .review-card-header .date { font-size: 14px; font-weight: 600; }
  .review-card-header .meta { font-size: 12px; color: var(--text-secondary); }
  .review-card-preview { font-size: 14px; color: var(--text-secondary); line-height: 1.65; }

  /* 复盘详情：Tab 栏 */
  .review-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .review-tab {
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
    transition: color .15s, border-color .15s;
    white-space: nowrap;
  }
  .review-tab:hover { color: var(--text); }
  .review-tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

  /* 复盘：对话气泡 */
  .dialog-line {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.7;
  }
  .dialog-line.interviewer { background: var(--blue-soft); border-left: 3px solid var(--blue); }
  .dialog-line.candidate { background: var(--neutral-soft); border-left: 3px solid var(--text-tertiary); }
  .dialog-line .speaker { font-size: 12px; font-weight: 600; margin-bottom: 4px; }

  /* 复盘：问答卡片 */
  .qa-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .qa-card .qa-q { font-weight: 600; font-size: 14px; margin-bottom: 8px; line-height: 1.5; }
  .qa-card .qa-a { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 6px; }
  .qa-card .qa-comment { font-size: 13px; color: var(--blue); }

  /* 复盘：评价卡片 */
  .eval-block { margin-bottom: 16px; }
  .eval-block h4 { font-size: 14px; margin-bottom: 8px; }
  .eval-item {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.7;
  }
  .eval-item.strength { background: var(--blue-soft); border-left: 3px solid var(--blue); }
  .eval-item.weakness { background: var(--neutral-soft); border-left: 3px solid var(--text); }
  .eval-item .eval-point { font-weight: 600; }
  .eval-item .eval-detail { font-size: 13px; color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }

  /* 复盘引导提示 */
  .review-hint {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.8;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    margin-top: 20px;
  }

  /* 状态标签（统一为胶囊） */
  .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.5;
  }
  .tag-matched, .tag-complete { background: var(--blue-soft); color: var(--blue); }
  .tag-fill, .tag-pending { background: var(--neutral-soft); color: var(--text-secondary); }
  .tag-missing { background: var(--text); color: #fff; }

  /* 进度条 */
  .progress-bar {
    height: 8px;
    background: var(--neutral-soft);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--blue);
    border-radius: 999px;
    transition: width .3s;
  }

  /* 空状态 */
  .empty {
    text-align: center;
    padding: 64px 20px;
    color: var(--text-secondary);
  }
  .empty .icon { font-size: 48px; margin-bottom: 16px; }

  /* 通知下拉 */
  .notif-dropdown {
    position: absolute;
    top: 52px;
    right: 0;
    width: 340px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(0,0,0,.12);
    z-index: 100;
    display: none;
    max-height: 380px;
    overflow-y: auto;
  }
  .notif-dropdown.show { display: block; }
  .notif-item { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.5; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item .time { font-size: 12px; color: var(--text-secondary); }

  /* 投递进度选择器 */
  .status-select {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    max-width: 120px;
    outline: none;
    font-family: var(--font);
    color: var(--text);
  }
  .status-select:focus { border-color: var(--blue); }
  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    line-height: 1.5;
  }

  /* 投递阶段：黑白蓝渐进（浅→深 = 流程推进；深蓝=已录用；近黑=终止/警示） */
  .sts-not_started { background: var(--neutral-soft); color: var(--text-secondary); }
  .sts-preparing { background: var(--neutral-soft); color: var(--text); }
  .sts-submitted { background: var(--blue-soft); color: var(--blue); }
  .sts-assessment, .sts-ai_interview, .sts-screening, .sts-group_interview { background: var(--blue-soft); color: var(--blue-strong); }
  .sts-interview_1, .sts-interview_2, .sts-interview_3 { background: #d4e6fa; color: var(--blue-strong); }
  .sts-offer { background: var(--blue); color: #fff; font-weight: 600; }
  .sts-rejected { background: var(--text); color: #fff; }
  .sts-withdrawn { background: var(--neutral-soft); color: var(--text-tertiary); text-decoration: line-through; }
  .sts-custom { background: #fff; color: var(--text-secondary); border: 1px dashed var(--text-tertiary); }

  .custom-remove-btn {
    font-size: 11px;
    color: var(--text-tertiary);
    cursor: pointer;
    margin-left: 4px;
    opacity: .6;
    transition: opacity .15s;
  }
  .custom-remove-btn:hover { opacity: 1; }
</style>
</head>
<body>

<!-- ═══ 左侧导航树 ═══ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">📋</span> 面试工作台
  </div>

  <!-- 知识库 -->
  <div class="kb-entry" onclick="toggleKB()">
    📚 个人知识库
    <span class="badge" id="kbBadge" style="display:none">0</span>
  </div>
  <div class="kb-children" id="kbChildren">
    <div class="kb-child" onclick="showAllExperiences()">📋 全部经历 (<span id="expCount">0</span>)</div>
    <div class="kb-child" onclick="showPending()">⚠️ 待完善 (<span id="pendingCount">0</span>)</div>
  </div>

  <!-- 岗位列表 -->
  <div class="positions-section">📋 我的岗位</div>
  <div id="posList"></div>

  <!-- 底部 -->
  <div class="sidebar-footer">
    <button class="btn-new" onclick="alert('请在 Claude Code 对话中说「新建岗位」或「分析JD」来创建岗位。')">➕ 新建岗位</button>
  </div>
</aside>

<!-- ═══ 右侧 ═══ -->
<div class="main">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="page-title" id="pageTitle">📊 工作台总览</div>
    <div class="bell" onclick="toggleNotif()">
      🔔
      <span class="dot" id="notifDot"></span>
    </div>
    <div class="notif-dropdown" id="notifDropdown">
      <div style="padding:12px 16px;font-size:11px;color:var(--text-secondary)">暂无待处理通知</div>
    </div>
  </div>

  <!-- 内容面板 -->
  <div class="content" id="content"></div>
</div>

<!-- ═══ 加载数据 ═══ -->
<script src="data/workbench-data.js"></script>

<script>
// ============================================================
// 全局状态
// ============================================================
let activePosId = null;
let activeView = 'overview'; // overview | experiences | pending | position | exp-detail
let expandedPos = {};
let previousView = null; // 记录上一个视图，用于详情页返回
let previousViewArgs = null; // 返回时需要的参数

// ============================================================
// 投递进度管理（localStorage 持久化 + 自定义阶段）
// ============================================================
const STATUS_CONFIG = [
  { value: 'not_started',  label: '📋 未投递',    cls: 'sts-not_started' },
  { value: 'preparing',    label: '📝 准备中',    cls: 'sts-preparing' },
  { value: 'submitted',    label: '📤 已投递',    cls: 'sts-submitted' },
  { value: 'assessment',   label: '📝 测评',      cls: 'sts-assessment' },
  { value: 'ai_interview', label: '🤖 AI面',      cls: 'sts-ai_interview' },
  { value: 'screening',    label: '🔍 简历筛选',  cls: 'sts-screening' },
  { value: 'group_interview', label: '👥 群面',   cls: 'sts-group_interview' },
  { value: 'interview_1',  label: '🎯 一面',      cls: 'sts-interview_1' },
  { value: 'interview_2',  label: '🎯 二面',      cls: 'sts-interview_2' },
  { value: 'interview_3',  label: '🎯 三面/终面', cls: 'sts-interview_3' },
  { value: 'offer',        label: '🎉 Offer',     cls: 'sts-offer' },
  { value: 'rejected',     label: '❌ 未通过',    cls: 'sts-rejected' },
  { value: 'withdrawn',    label: '🚫 已放弃',    cls: 'sts-withdrawn' },
];

// Custom stage CSS uses a neutral violet palette
const CUSTOM_CLS = 'sts-custom';

function getAppStore() {
  try { return JSON.parse(localStorage.getItem('wb_app_status') || '{}'); } catch(e) { return {}; }
}

function saveAppStore(store) {
  localStorage.setItem('wb_app_status', JSON.stringify(store));
}

function getAppStatus(posId) {
  const store = getAppStore();
  if (store[posId]) return store[posId];
  const p = findPos(posId);
  return {
    status: (p && p.applicationStatus) || 'not_started',
    log: (p && p.applicationLog) || [],
    customStages: []
  };
}

function setAppStatus(posId, newStatus) {
  const store = getAppStore();
  const current = getAppStatus(posId);
  const now = new Date().toISOString().slice(0, 10);
  const log = current.log || [];
  if (log.length === 0 || log[log.length-1].status !== newStatus) {
    log.push({ status: newStatus, date: now });
  }
  store[posId] = { status: newStatus, log: log, customStages: current.customStages || [] };
  saveAppStore(store);
  renderSidebar();
  if (activeView === 'overview') renderOverview();
  if (activeView === 'position') {
    // re-render current position view
    if (document.getElementById('pageTitle').textContent.includes('JD拆解')) showPositionOverview(activePosId);
  }
}

function addCustomStage(posId) {
  const name = prompt('输入自定义阶段名称（如"笔试""HR面""加面"）：');
  if (!name || !name.trim()) return;
  const store = getAppStore();
  const current = getAppStatus(posId);
  const customStages = current.customStages || [];
  const value = 'custom_' + Date.now();
  customStages.push({ value, label: '✏️ ' + name.trim(), cls: CUSTOM_CLS });
  store[posId] = { status: current.status, log: current.log || [], customStages: customStages };
  saveAppStore(store);
  // Auto-select the new custom stage
  setAppStatus(posId, value);
}

function removeCustomStage(posId, value) {
  const store = getAppStore();
  const current = getAppStatus(posId);
  const customStages = (current.customStages || []).filter(s => s.value !== value);
  // If currently selected custom stage is being removed, reset to not_started
  const newStatus = (current.status === value) ? 'not_started' : current.status;
  store[posId] = { status: newStatus, log: current.log || [], customStages: customStages };
  saveAppStore(store);
  renderSidebar();
  if (activeView === 'overview') renderOverview();
  if (activeView === 'position' && document.getElementById('pageTitle').textContent.includes('JD拆解')) showPositionOverview(activePosId);
}

// Get all available stages for a position (built-in + custom)
function getAllStages(posId) {
  const current = getAppStatus(posId);
  const customStages = (current && current.customStages) || [];
  return [...STATUS_CONFIG, ...customStages];
}

// Get display config for any status value (including custom)
function getStatusConfig(posId, statusValue) {
  const all = getAllStages(posId);
  return all.find(s => s.value === statusValue) || { label: statusValue, cls: CUSTOM_CLS };
}

function onStatusChange(posId, selectEl) {
  const val = selectEl.value;
  if (val === '__add_custom__') {
    selectEl.value = getAppStatus(posId).status || 'not_started'; // reset dropdown
    addCustomStage(posId);
    return;
  }
  if (val === '__remove_custom__') {
    selectEl.value = getAppStatus(posId).status || 'not_started';
    // show which custom stages to remove
    const current = getAppStatus(posId);
    const customStages = current.customStages || [];
    if (customStages.length === 0) { alert('暂无自定义阶段'); return; }
    const toRemove = prompt('输入要删除的自定义阶段名称（精确匹配）：\n当前自定义阶段：' + customStages.map(s => s.label).join('、'));
    if (!toRemove) return;
    const found = customStages.find(s => s.label.includes(toRemove));
    if (found) { removeCustomStage(posId, found.value); }
    else { alert('未找到匹配的自定义阶段'); }
    return;
  }
  setAppStatus(posId, val);
}

// 从详情页返回上一视图
function goBackFromDetail() {
  if (previousView === 'overview' || !previousView) {
    renderOverview();
  } else if (previousView === 'experiences') {
    showAllExperiences();
  } else if (previousView === 'pending') {
    showPending();
  } else if (previousView === 'position' && previousViewArgs) {
    // 重新渲染岗位视图（回到之前的岗位页面）
    showMatchBoard(previousViewArgs);
  } else if (previousView === 'interview-review' && previousViewArgs) {
    // 回到复盘列表
    showInterviewReview(previousViewArgs);
  } else {
    renderOverview();
  }
}

          <span class="tag tag-matched" style="font-size:13px;">${esc(mr.tier)}</span>
        </div>
        <div style="display:flex;gap:16px;font-size:12px;color:var(--text-secondary);">
          <div>MustHave <b style="color:var(--green);">${Math.round(mr.mustHaveScore*100)}%</b></div>
          <div>NiceToHave <b style="color:var(--blue);">${Math.round(mr.niceToHaveScore*100)}%</b></div>
          <div>信号契合 <b style="color:var(--blue);">${Math.round(mr.hiddenSignalFit*100)}%</b></div>
        </div>
      </div>
      <div class="progress-bar" style="margin-top:10px;">
        <div class="fill" style="width:${parseFloat(mr.score)}%;"></div>
      </div>
      <p style="font-size:11px;color:var(--text-secondary);margin-top:6px;">评估时间：${esc(mr.assessedAt||'')}</p>
    </div>` : `
    <div class="stats-row">
      <div class="stat-card green"><div class="num">${matched}</div><div class="label">🟢 匹配</div></div>
      <div class="stat-card yellow"><div class="num">${fill}</div><div class="label">🟡 短期可补</div></div>
      <div class="stat-card red"><div class="num">${missing}</div><div class="label">🔴 绝对缺失</div></div>
      ${total > 0 ? `<div class="stat-card"><div class="num">${Math.round(matched/total*100)}%</div><div class="label">匹配率</div></div>` : ''}
    </div>`}

    ${reqs.length === 0 ? '<div class="empty"><p>该岗位尚未进行JD拆解。在对话中说"匹配度"或"能力看板"开始分析。</p></div>' : `
      <div class="card"><h3>逐条匹配详情 <span style="font-size:11px;color:var(--text-secondary);font-weight:400;">（点击经历名查看详情）</span></h3><table>
        <tr><th>要求</th><th>评分</th><th>状态</th><th>匹配经历 / 补全建议</th></tr>
        ${reqs.map(r => {
          const matchedExps = (r.matchedExpIds||[]).map(id => findExp(id)).filter(Boolean);
          const scoreLabel = r.score !== undefined ? (r.score === 1.0 ? '🟢 1.0' : r.score === 0.5 ? '🟡 0.5' : '🔴 0.0') : '-';
          let detail = '';
          if (r.status === 'matched') {
            detail = matchedExps.map(e => `<span style="color:var(--blue);cursor:pointer;text-decoration:underline;" onclick="showExperienceDetail('${e.id}')" title="点击查看完整经历">${esc(e.title)}</span>`).join('、') || r.note || '-';
          } else if (r.status === 'short_term_fill') {
            detail = (r.gapTier ? '<span class="tag tag-fill" style="margin-right:4px;">' + esc(r.gapTier==='fixable'?'🔧 可补':r.gapTier==='hard'?'⏳ 难补':'🤷 不重要') + '</span>' : '')
              + (r.gapFix ? esc(r.gapFix).slice(0,120) + (r.gapFix.length>120?'...':'') : esc(r.note||'-'));
          } else {
            detail = esc(r.note||'-');
          }
          return `
          <tr>
            <td><strong>${esc(r.text)}</strong></td>
            <td>${scoreLabel}</td>
            <td><span class="tag ${r.status==='matched'?'tag-matched':r.status==='short_term_fill'?'tag-fill':'tag-missing'}">${r.status==='matched'?'✅ 匹配':r.status==='short_term_fill'?'🟡 短期可补':'❌ 绝对缺失'}</span></td>
            <td style="font-size:12px;max-width:280px;">${detail}</td>
          </tr>`;
        }).join('')}
      </table></div>`}

    ${mr && mr.risks && mr.risks.length > 0 ? `
    <div class="card" style="border-left:3px solid var(--yellow);">
      <h3>⚠️ 风险分析</h3>
      ${mr.risks.map(risk => `
        <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <strong>${esc(risk.dimension)}</strong>
            <span class="tag ${risk.level==='中'?'tag-fill':'tag-missing'}" style="font-size:10px;">${esc(risk.level)}风险</span>
          </div>
          <p style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;">📌 ${esc(risk.concern)}</p>
          <p style="font-size:12px;background:var(--neutral-soft);padding:10px 12px;border-radius:8px;margin-bottom:6px;">💬 HM可能问：${esc(risk.probe)}</p>
          <p style="font-size:12px;background:var(--blue-soft);padding:10px 12px;border-radius:8px;">✅ 建议应对：${esc(risk.response)}</p>
        </div>`).join('')}
    </div>` : ''}
  `;
}

function openResumeFile(path) {
  if (!path) { alert('简历文件路径未记录。请重新生成简历。'); return; }
  // 在新标签页打开HTML文件
  window.open(path, '_blank');
}

function showInterviewPrep(posId) {
  activeView = 'position';
  activePosId = posId;
  previousView = null;
  previousViewArgs = null;
  const p = findPos(posId);
  if (!p) return;
  document.getElementById('pageTitle').textContent = `🎯 ${p.name} · 面试准备`;
  highlightSidebar(posId);
  togglePosition(posId, true);

  const qas = p.interviewQAs || [];
  const skills = p.skillCards || [];
  const skillDone = skills.filter(s => s.completed).length;

  // Group QAs by category
  const catLabels = { 'behavior': '🧑 行为题', 'deep-dive': '🔍 经历深挖', 'skill': '📊 技能/专业考察', 'company-specific': '🏢 公司/岗位特化' };

  });

  document.getElementById('content').innerHTML = `
    <!-- 技能复习 -->
    <div class="card"><h3>📖 硬技能复习 (${skillDone}/${skills.length})</h3>
      ${skills.length === 0 ? '<p style="color:var(--text-secondary);">待生成技能卡。在对话中说"准备面试"或"硬技能复习"开始。</p>' : `
        <div class="progress-bar" style="margin-bottom:14px;"><div class="fill" style="width:${Math.round(skillDone/skills.length*100)}%;"></div></div>
        ${skills.map(s => `
          <details style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;">
            <summary style="cursor:pointer;font-weight:600;font-size:14px;">
              ${s.completed ? '✅' : '⏳'} ${esc(s.name)}
            </summary>
            <p style="font-size:13px;color:var(--text);margin-top:8px;line-height:1.7;">${esc(s.principle||'')}</p>
          </details>`).join('')}
      `}
    </div>

    <!-- 面试问答 -->
    <div class="card"><h3>✍️ 问答打磨 (${qas.length}道预判题)</h3>
      ${qas.length === 0 ? '<p style="color:var(--text-secondary);">待生成面试问答。在对话中说"准备面试"或"面试问答"开始。</p>' : ''}
      ${Object.entries(grouped).map(([cat, items]) => `
        <h4 style="margin:16px 0 8px;color:var(--text-secondary);font-size:13px;">${catLabels[cat]||cat} (${items.length}道)</h4>
        ${items.map(q => `
          <details style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;">
            <summary style="cursor:pointer;font-weight:600;font-size:13px;">
              ${esc(q.question)}
            </summary>
            <div style="margin-top:10px;font-size:12px;line-height:1.7;">
              <p style="color:var(--text-secondary);">📌 来源：${esc(q.source||'')}</p>
              <p style="color:var(--text-secondary);">💡 为什么问：${esc(q.whyAsked||'')}</p>
              <p style="background:var(--blue-soft);padding:10px 12px;border-radius:8px;margin:8px 0;">🎯 准备方向：${esc(q.prepDirection||'')}</p>
              ${q.aiGeneratedDraft ? `
              <details style="margin-top:4px;">
                <summary style="cursor:pointer;color:var(--blue);font-size:12px;">📝 AI生成STAR初稿</summary>
                <p style="background:var(--neutral-soft);padding:10px 12px;border-radius:8px;margin-top:6px;white-space:pre-line;">${esc(q.aiGeneratedDraft)}</p>
              </details>` : ''}
              ${q.draftAnswer ? `<p style="background:var(--blue-soft);padding:10px 12px;border-radius:8px;margin-top:6px;">✅ 已保存答案：${esc(q.draftAnswer).slice(0,150)}...</p>` : ''}
              ${(q.referencedExpIds||[]).length > 0 ? `<p style="font-size:11px;color:var(--text-secondary);margin-top:4px;">引用经历：${q.referencedExpIds.map(id=>esc(findExp(id)?.title||id)).join('、')}</p>` : ''}
            </div>
          </details>`).join('')}
      `).join('')}
    </div>
  `;
}

function showInterviewReview(posId) {
  activeView = 'position';
  activePosId = posId;
  previousView = null;
  previousViewArgs = null;
  const p = findPos(posId);
  if (!p) return;
  document.getElementById('pageTitle').textContent = `🎙️ ${p.name} · 面试复盘`;
  highlightSidebar(posId);
  togglePosition(posId, true);

  const reviews = (WORKBENCH.reviewRecords || []).filter(r => r.positionId === posId);
  // 兼容新旧 schema：有 aiAnalysis 为已分析，有 evaluation 文本为旧版已分析
  const getStatus = (r) => {
    if (r.aiAnalysis) return 'analyzed';
    if (r.evaluation && typeof r.evaluation === 'string') return 'legacy';
    return 'pending';
  };

  document.getElementById('content').innerHTML = `
    <div class="card">
      <h3>🎙️ 面试复盘 (${reviews.length}条)</h3>
      ${reviews.length === 0 ? `
        <div class="empty">
          <div class="icon">🎙️</div>
          <p>暂无复盘记录</p>
        </div>` : reviews.sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(r => {
          const status = getStatus(r);
          const statusTag = status === 'analyzed'
            ? '<span class="tag tag-matched">✅ 已分析</span>'
            : status === 'legacy'
            ? '<span class="tag tag-matched" style="background:var(--neutral-soft);color:var(--text-secondary);">📝 已分析（旧版）</span>'
            : '<span class="tag tag-pending">⏳ 待分析</span>';
          const preview = esc((r.transcript || r.evaluation || '').slice(0, 80));
          const groupsCount = r.aiAnalysis?.qaGroups?.length || 0;
          const newExpCount = (r.newExperiencesExtracted || []).length;
          const metaParts = [];
          if (groupsCount) metaParts.push(`${groupsCount} 组问答`);
          if (newExpCount) metaParts.push(`发现 ${newExpCount} 条新经历`);

          return `
          <div class="review-card" onclick="${status !== 'pending' ? `showReviewDetail('${r.id}')` : ''}" style="${status === 'pending' ? 'cursor:default;' : ''}">
            <div class="review-card-header">
              <span class="date">📅 ${esc(r.date||'')}</span>
              <span>${statusTag}</span>
            </div>
            <div class="review-card-preview">
              ${preview}${(r.transcript||'').length > 80 ? '...' : ''}
            </div>
            ${metaParts.length > 0 ? `<div class="review-card-header" style="margin-top:6px;margin-bottom:0;"><span class="meta">${metaParts.join(' · ')}</span></div>` : ''}
            ${status === 'pending' ? `<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">💡 在 Claude Code 对话中说<code style="background:var(--neutral-soft);padding:1px 6px;border-radius:6px;">分析复盘</code>触发AI分析</div>` : ''}
          </div>`;
        }).join('')}
    </div>

    <div class="review-hint">
      📢 新面试复盘？在 Claude Code 对话中说「<strong>面试复盘</strong>」或直接上传录音文件，AI 会自动转录并分析。<br>
      <span style="font-size:11px;">支持文字复盘和音频上传（.mp3/.wav/.m4a 等格式）</span>
    </div>
  `;
}

function showReviewDetail(reviewId) {
  activeView = 'exp-detail';
  previousView = 'interview-review';
  previousViewArgs = activePosId;

  const review = (WORKBENCH.reviewRecords || []).find(r => r.id === reviewId);
  if (!review) {
    document.getElementById('content').innerHTML = '<div class="empty"><p>未找到该复盘记录</p></div>';
    return;
  }

  const p = findPos(review.positionId);
  document.getElementById('pageTitle').textContent = `🎙️ 复盘详情 · ${esc(p?.name||'')}`;
  highlightSidebar(null);

  // 判断分析类型
  const ai = review.aiAnalysis;
  const hasNewAnalysis = ai && (ai.fullDialog || ai.qaGroups || ai.evaluation);
  const hasLegacyEval = review.evaluation && typeof review.evaluation === 'string' && !ai;

  // 构建 Tab
  const tabs = [];
  if (ai?.fullDialog?.length > 0) tabs.push({ key: 'dialog', label: '📝 对话还原' });
  if (ai?.qaGroups?.length > 0) tabs.push({ key: 'qa', label: '📋 问答整理' });
  if (ai?.evaluation) tabs.push({ key: 'eval', label: '🎯 面试总评' });
  if (hasLegacyEval) tabs.push({ key: 'legacy', label: '📝 分析' });
  if ((review.newExperiencesExtracted || []).length > 0) tabs.push({ key: 'exp', label: '🔍 新经历' });

  const activeTab = tabs.length > 0 ? tabs[0].key : '';

  document.getElementById('content').innerHTML = `
    <div class="back-btn" onclick="goBackFromDetail()">← 返回复盘列表</div>

    <div class="card" style="padding:12px 20px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <div>
          <span style="font-size:13px;font-weight:600;">📅 ${esc(review.date||'')}</span>
          <span style="font-size:11px;color:var(--text-secondary);margin-left:8px;">岗位：${esc(p?.name||'未知')}</span>
        </div>
        <span class="tag ${hasNewAnalysis ? 'tag-matched' : hasLegacyEval ? 'tag-matched' : 'tag-pending'}">${hasNewAnalysis ? '✅ 已深度分析' : hasLegacyEval ? '📝 已分析（旧版）' : '⏳ 待分析'}</span>
      </div>
    </div>

    ${tabs.length > 0 ? `
    <div class="review-tabs" id="reviewTabs">
      ${tabs.map((t, i) => `<div class="review-tab ${i === 0 ? 'active' : ''}" data-tab="${t.key}" onclick="switchReviewTab('${t.key}')">${t.label}</div>`).join('')}
    </div>
    <div id="reviewTabContent"></div>` : `
    <div class="card">
      <div class="empty"><p>暂无分析内容</p><p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">在 Claude Code 对话中说「分析复盘」触发AI分析</p></div>
    </div>`}

    ${review.transcript ? `
    <details style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
      <summary style="cursor:pointer;">📝 原始复盘文本</summary>
      <p style="background:var(--neutral-soft);padding:14px 16px;border-radius:10px;margin-top:8px;line-height:1.7;white-space:pre-wrap;">${esc(review.transcript)}</p>
    </details>` : ''}
  `;

  // 存储 review 数据供 tab 切换使用
  window._currentReview = review;
  window._currentReviewHasLegacy = hasLegacyEval;

  // 渲染第一个 tab
  if (activeTab) renderReviewTab(activeTab);
}

function switchReviewTab(tabKey) {
  // 更新 tab 样式
  document.querySelectorAll('.review-tab').forEach(el => el.classList.remove('active'));
  const tabEl = document.querySelector(`.review-tab[data-tab="${tabKey}"]`);
  if (tabEl) tabEl.classList.add('active');
  renderReviewTab(tabKey);
}

function renderReviewTab(tabKey) {
  const review = window._currentReview;
  if (!review) return;
  const ai = review.aiAnalysis;
  const container = document.getElementById('reviewTabContent');
  if (!container) return;

  let html = '';

  if (tabKey === 'dialog' && ai?.fullDialog) {
    html = `<div class="card"><h3>📝 完整对话还原</h3>
      ${ai.fullDialog.map(line => `
        <div class="dialog-line ${line.speaker === '面试官' ? 'interviewer' : 'candidate'}">
          <div class="speaker" style="color:${line.speaker==='面试官'?'var(--blue)':'var(--text-secondary)'}">${esc(line.speaker)}</div>
          <div>${esc(line.content)}</div>
        </div>`).join('')}
    </div>`;
  } else if (tabKey === 'qa' && ai?.qaGroups) {
    html = `<div class="card"><h3>📋 问答整理</h3>
      ${ai.qaGroups.map(qa => `
        <div class="qa-card">
          <div class="qa-q">${esc(qa.topic)}</div>
          <div class="qa-q" style="font-weight:400;">❓ ${esc(qa.interviewerQuestion)}</div>
          <div class="qa-a">💬 ${esc(qa.candidateAnswer)}</div>
          ${qa.briefComment ? `<div class="qa-comment">💬 ${esc(qa.briefComment)}</div>` : ''}
        </div>`).join('')}
    </div>`;
  } else if (tabKey === 'eval' && ai?.evaluation) {
    const ev = ai.evaluation;
    html = `<div class="card" style="margin-bottom:12px;">
      <h3>整体印象</h3>
      <p style="font-size:14px;line-height:1.8;">${esc(ev.overallImpression)}</p>
    </div>`;

    if (ev.strengths?.length) {
      html += `<div class="card"><h3>✅ 做得好的地方</h3>
        ${ev.strengths.map(s => `
          <div class="eval-item strength">
            <div class="eval-point">${esc(s.point)}</div>
            ${s.example ? `<div class="eval-detail">📌 ${esc(s.example)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    }

    if (ev.weaknesses?.length) {
      html += `<div class="card"><h3>⚠️ 明显问题</h3>
        ${ev.weaknesses.map(w => `
          <div class="eval-item weakness">
            <div class="eval-point">${esc(w.point)}</div>
            ${w.whyProblem ? `<div class="eval-detail">🔍 ${esc(w.whyProblem)}</div>` : ''}
            ${w.suggestion ? `<div class="eval-detail" style="color:var(--green);">💡 改进：${esc(w.suggestion)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    }

    if (ev.improvementTips?.length) {
      html += `<div class="card"><h3>💡 优化建议</h3>
        <ul style="padding-left:20px;line-height:2;">
          ${ev.improvementTips.map(t => `<li style="font-size:13px;">${esc(t)}</li>`).join('')}
        </ul>
      </div>`;
    }
  } else if (tabKey === 'legacy' && window._currentReviewHasLegacy) {
    html = `<div class="card">
      <h3>📝 面试分析</h3>
      <p style="font-size:14px;line-height:1.8;white-space:pre-wrap;">${esc(review.evaluation)}</p>
    </div>`;
  } else if (tabKey === 'exp') {
    const expIds = review.newExperiencesExtracted || [];
    const exps = expIds.map(id => findExp(id)).filter(Boolean);
    html = `<div class="card"><h3>🔍 本次复盘发现的新经历 (${exps.length}条)</h3>
      ${exps.length === 0 ? '<p style="color:var(--text-secondary);">未发现新经历</p>' : ''}
      ${exps.map(e => `
        <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;">
          <div style="font-weight:600;font-size:13px;margin-bottom:6px;color:var(--blue);cursor:pointer;text-decoration:underline;" onclick="showExperienceDetail('${e.id}')">${esc(e.title)}</div>
          ${e.behavior ? `<div class="eval-detail">🎬 ${esc(e.behavior).slice(0,120)}${e.behavior.length>120?'...':''}</div>` : ''}
          ${e.method ? `<div class="eval-detail">🔧 ${esc(e.method).slice(0,120)}${e.method.length>120?'...':''}</div>` : ''}
          ${e.result ? `<div class="eval-detail">📊 ${esc(e.result).slice(0,120)}${e.result.length>120?'...':''}</div>` : ''}
          <span class="tag ${e.status==='complete'?'tag-matched':'tag-pending'}" style="margin-top:6px;">${e.status==='complete'?'已完善':'待完善'}</span>
        </div>`).join('')}
    </div>`;
  }

  container.innerHTML = html;
}

// ============================================================
// 辅助函数
// ============================================================
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function findPos(id) { return (WORKBENCH.positions||[]).find(p => p.id === id); }
function findExp(id) { return (WORKBENCH.experiences||[]).find(e => e.id === id); }

function toggleKB() {
  document.getElementById('kbChildren').classList.toggle('open');
}

function togglePosition(posId, forceOpen) {
  const el = document.getElementById('posChildren-' + posId);
  if (!el) return;
  if (forceOpen) { el.classList.add('open'); return; }
  el.classList.toggle('open');
  expandedPos[posId] = el.classList.contains('open');
}

function highlightSidebar(posId) {
  document.querySelectorAll('.pos-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.pos-child').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.kb-child').forEach(el => el.classList.remove('active'));
  if (posId) {
    const posEl = document.getElementById('pos-' + posId);
    if (posEl) posEl.classList.add('active');
  }
}

function toggleNotif() {
  const dd = document.getElementById('notifDropdown');
  dd.classList.toggle('show');
  // 点击其他地方关闭
  if (dd.classList.contains('show')) {
    setTimeout(() => {
      document.addEventListener('click', function closeNotif(e) {
        if (!e.target.closest('.bell')) {
          dd.classList.remove('show');
          document.removeEventListener('click', closeNotif);
        }
      });
    }, 100);
  }
}

// 启动
document.addEventListener('DOMContentLoaded', init);
</script>
